<svg xmlns="http://www.w3.org/2000/svg" width="820" height="760" font-family="Segoe UI, Arial, sans-serif" viewBox="0 0 820 760">
  <defs>
    <linearGradient id="gam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1f2e3d"/>
      <stop offset="100%" stop-color="#103c62"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="820" height="760" fill="#eef2f7"/>

  <!-- ============ COLLAPSED ============ -->
  <text x="205" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#103c62">MOBILE (390px) — Menu collapsed</text>

  <!-- Phone frame -->
  <rect x="20" y="55" width="370" height="680" rx="34" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <!-- Notch -->
  <rect x="165" y="55" width="80" height="14" rx="7" fill="#0f172a"/>

  <!-- Sticky header bar -->
  <rect x="20" y="69" width="370" height="64" fill="#ffffff" fill-opacity="0.92" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="20" y1="133" x2="390" y2="133" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Logo -->
  <rect x="36" y="87" width="40" height="40" rx="12" fill="#d8f3f7" stroke="#29b7d7" stroke-width="1.2"/>
  <path d="M46 112 L56 92 L66 112 Z" fill="#29b7d7"/>
  <rect x="48" y="103" width="16" height="6" rx="3" fill="#1f2e3d"/>

  <!-- Wordmark -->
  <text x="86" y="100" font-size="15" font-weight="800" fill="#103c62" letter-spacing="0.5">SK WEB</text>
  <text x="86" y="116" font-size="7.5" font-weight="700" fill="#29b7d7" letter-spacing="2">SOLUTIONS</text>

  <!-- Menu toggle (right) -->
  <rect x="312" y="84" width="64" height="34" rx="10" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="344" y="106" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2e3d">Menu</text>

  <!-- Hero -->
  <rect x="20" y="133" width="370" height="230" fill="#0f172a"/>
  <text x="40" y="172" font-size="11" fill="#bfdbfe">Mr. Sarang Kumar</text>
  <text x="40" y="200" font-size="22" font-weight="800" fill="#fff">SK Web</text>
  <text x="40" y="226" font-size="22" font-weight="800" fill="#fff">Solutions</text>
  <text x="40" y="252" font-size="10" fill="#cbd5e1">Responsive, brand-focused</text>
  <text x="40" y="266" font-size="10" fill="#cbd5e1">frontend development.</text>
  <rect x="40" y="288" width="120" height="30" rx="15" fill="#2563eb"/>
  <text x="100" y="308" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Explore</text>
  <rect x="170" y="288" width="120" height="30" rx="15" fill="#1f2e3d" stroke="#475569"/>
  <text x="230" y="308" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Contact</text>

  <!-- ============ EXPANDED ============ -->
  <text x="615" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#103c62">MOBILE (390px) — Menu open</text>

  <rect x="430" y="55" width="370" height="680" rx="34" fill="#fff" stroke="#cbd5e1" stroke="2"/>
  <rect x="575" y="55" width="80" height="14" rx="7" fill="#0f172a"/>

  <rect x="430" y="69" width="370" height="64" fill="#ffffff" fill-opacity="0.92" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="430" y1="133" x2="800" y2="133" stroke="#e2e8f0" stroke-width="1"/>

  <rect x="446" y="87" width="40" height="40" rx="12" fill="#d8f3f7" stroke="#29b7d7" stroke-width="1.2"/>
  <path d="M456 112 L466 92 L476 112 Z" fill="#29b7d7"/>
  <rect x="458" y="103" width="16" height="6" rx="3" fill="#1f2e3d"/>
  <text x="496" y="100" font-size="15" font-weight="800" fill="#103c62" letter-spacing="0.5">SK WEB</text>
  <text x="496" y="116" font-size="7.5" font-weight="700" fill="#29b7d7" letter-spacing="2">SOLUTIONS</text>

  <rect x="722" y="84" width="64" height="34" rx="10" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="754" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2e3d">Close</text>

  <!-- Hero behind -->
  <rect x="430" y="133" width="370" height="200" fill="#0f172a"/>

  <!-- Dropdown menu -->
  <rect x="446" y="150" width="338" height="232" rx="16" fill="#ffffff" filter="url(#sh)" stroke="#e2e8f0"/>
  <line x1="466" y1="190" x2="764" y2="190" stroke="#eef2f7"/>
  <line x1="466" y1="230" x2="764" y2="230" stroke="#eef2f7"/>
  <line x1="466" y1="270" x2="764" y2="270" stroke="#eef2f7"/>
  <line x1="466" y1="310" x2="764" y2="310" stroke="#eef2f7"/>
  <text x="466" y="178" font-size="16" font-weight="700" fill="#1f2e3d">Home</text>
  <text x="466" y="218" font-size="16" font-weight="700" fill="#1f2e3d">Services</text>
  <text x="466" y="258" font-size="16" font-weight="700" fill="#1f2e3d">Portfolio</text>
  <text x="466" y="298" font-size="16" font-weight="700" fill="#1f2e3d">Blog</text>
  <text x="466" y="338" font-size="16" font-weight="700" fill="#1f2e3d">Contact</text>

  <!-- caption -->
  <text x="410" y="735" font-size="11" fill="#64748b">Header stays on one row: logo + "SK WEB SOLUTIONS" on the left, "Menu" toggle on the right. The game button is hidden to avoid crowding; it remains in the hero.</text>
</svg>
